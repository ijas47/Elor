<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <!-- Elor stacked lockup · for dark backgrounds (avatars, hero, packaging) -->
  <defs>
    <radialGradient id="orbS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7ead0"/>
      <stop offset="55%" stop-color="#e3c489"/>
      <stop offset="100%" stop-color="#b8935a"/>
    </radialGradient>
    <radialGradient id="haloS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3c489" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#e3c489" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e3c489" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(107,14) scale(1.05)">
    <circle cx="32" cy="44" r="26" fill="url(#haloS)"/>
    <line x1="32" y1="4" x2="32" y2="24" stroke="#ece5d6" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="32" cy="4" r="1.9" fill="#ece5d6"/>
    <circle cx="32" cy="44" r="18" stroke="#ece5d6" stroke-width="1.6" opacity="0.9"/>
    <circle cx="32" cy="44" r="11.5" stroke="#b8935a" stroke-width="1" opacity="0.6"/>
    <circle cx="32" cy="44" r="6" fill="url(#orbS)"/>
  </g>
  <text x="140" y="170" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="500" letter-spacing="10" fill="#ece5d6">ELOR</text>
  <text x="142" y="194" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="8" fill="#b8935a">LIGHTING</text>
</svg>
