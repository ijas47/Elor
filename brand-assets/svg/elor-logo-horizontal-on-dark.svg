<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Elor horizontal lockup · for dark backgrounds -->
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7ead0"/>
      <stop offset="55%" stop-color="#e3c489"/>
      <stop offset="100%" stop-color="#b8935a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3c489" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#e3c489" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e3c489" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- emblem (scaled from 64x72, placed at left, vertically centred) -->
  <g transform="translate(20,26) scale(0.92)">
    <circle cx="32" cy="44" r="26" fill="url(#halo)"/>
    <line x1="32" y1="4" x2="32" y2="24" stroke="#ece5d6" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="32" cy="4" r="1.9" fill="#ece5d6"/>
    <circle cx="32" cy="44" r="18" stroke="#ece5d6" stroke-width="1.6" opacity="0.9"/>
    <circle cx="32" cy="44" r="11.5" stroke="#b8935a" stroke-width="1" opacity="0.6"/>
    <circle cx="32" cy="44" r="6" fill="url(#orb)"/>
  </g>
  <!-- wordmark -->
  <text x="104" y="66" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="500" letter-spacing="9" fill="#ece5d6">ELOR</text>
  <text x="106" y="88" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="7.5" fill="#b8935a">LIGHTING</text>
</svg>
