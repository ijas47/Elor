  <text x="104" y="66" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="500" letter-spacing="9" fill="#1e1912">ELOR</text>
  <text x="106" y="88" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="7.5" fill="#9a7743">LIGHTING</text>
